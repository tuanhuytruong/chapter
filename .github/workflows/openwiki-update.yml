name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 00:00 UTC (07:00 Bangkok time)
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Install OpenWiki
        run: npm install --global openwiki@latest mermaid@latest jsdom@latest

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.NINE_ROUTER_URL }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
          OPENWIKI_MODEL_ID: n8n
          OPENWIKI_TELEMETRY_DISABLED: "1"

      - name: Commit and push wiki updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openwiki/ AGENTS.md CLAUDE.md
          git diff --staged --quiet || git commit -m "docs: update OpenWiki [skip ci]"
          git push origin dev
