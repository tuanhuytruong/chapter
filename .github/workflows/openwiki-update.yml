name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 00:00 UTC (07:00 Bangkok time)
    - cron: "0 0 * * *"
   

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: "22"

      - name: Install OpenWiki
        run: npm install --global openwiki@0.2.3 mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.NINE_ROUTER_URL }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
          OPENWIKI_MODEL_ID: n8n
          # Disable telemetry in CI
          OPENWIKI_TELEMETRY_DISABLED: "1"

      - name: Commit and push wiki updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openwiki/ AGENTS.md CLAUDE.md
          git diff --staged --quiet || git commit -m "docs: update OpenWiki [skip ci]"
          git push origin dev
