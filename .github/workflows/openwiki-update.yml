name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    # 00:13 Asia/Bangkok (17:13 UTC previous day). GitHub schedules are best-effort.
    - cron: "13 17 * * *"

# Scheduled workflow definitions are read from the default branch. Keep this file
# synchronized to main; the job itself always checks out and updates dev.
concurrency:
  group: openwiki-update-dev
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: dev
          persist-credentials: true

      - name: Assert dev checkout
        run: test "$(git rev-parse --abbrev-ref HEAD)" = "dev"

      - name: Install OpenWiki
        run: npm install --global openwiki@latest mermaid@latest jsdom@latest

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.NINE_ROUTER_URL }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
          OPENWIKI_MODEL_ID: n8n
          OPENWIKI_TELEMETRY_DISABLED: "1"

      - name: Commit and push wiki updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openwiki/ AGENTS.md CLAUDE.md
          git diff --staged --quiet || git commit -m "docs: update OpenWiki [skip ci]"
          git push origin HEAD:dev
